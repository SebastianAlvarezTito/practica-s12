
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-code
  namespace: practica-s12
  labels:
    app.kubernetes.io/name: app-backend
    app.kubernetes.io/part-of: practica-s12
data:
  server.py: |
    #!/usr/bin/env python3
    # -*- coding: utf-8 -*-
    """
    Backend de laboratorio - Practica S12 | AP9 (solo biblioteca estandar de Python).

    Endpoints:
      GET /          Informacion del servicio + estado de la BD (usado para la prueba curl).
      GET /health    LIVENESS : "el proceso esta vivo". NO consulta la BD a proposito:
                     si la BD cae no queremos que Kubernetes reinicie todos los backends.
      GET /ready     READINESS: "puedo atender trafico". Valida conexion + AUTH + PING a la BD.
                     Devuelve 503 si la BD no es alcanzable (el Pod sale del Service).
      GET /whoami    Evidencia de hardening: UID/GID del proceso y si el FS raiz es de solo lectura.

    Si falta una variable de entorno obligatoria la aplicacion termina con exit code 1
    (Escenario A -> CrashLoopBackOff). La contrasena NUNCA se imprime ni se devuelve.
    """
    import json
    import os
    import socket
    import sys
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    REQUIRED_VARS = ["APP_PORT", "DB_HOST", "DB_PORT", "DB_USER", "DB_PASS"]


    def log(msg):
        print(time.strftime("%Y-%m-%dT%H:%M:%S") + " " + msg, flush=True)


    def fatal(msg):
        log("FATAL: " + msg)
        sys.exit(1)


    # ---------------------------------------------------------------- validacion de entorno
    missing = [name for name in REQUIRED_VARS if not os.environ.get(name)]
    if missing:
        fatal(
            "variables de entorno requeridas no definidas: " + ", ".join(missing)
            + ". Revise los nombres de las claves en el ConfigMap 'app-config' "
            + "y en el Secret 'db-credentials'."
        )

    try:
        APP_PORT = int(os.environ["APP_PORT"])
        DB_PORT = int(os.environ["DB_PORT"])
        DB_TIMEOUT = float(os.environ.get("DB_TIMEOUT_SECONDS", "2"))
    except ValueError as exc:
        fatal("valor numerico invalido en APP_PORT / DB_PORT / DB_TIMEOUT_SECONDS: " + str(exc))

    DB_HOST = os.environ["DB_HOST"]
    DB_USER = os.environ["DB_USER"]
    DB_PASS = os.environ["DB_PASS"]
    APP_ENV = os.environ.get("APP_ENV", "unknown")


    # ---------------------------------------------------------------- cliente RESP minimo
    def resp_command(*parts):
        """Codifica un comando en el protocolo RESP de Redis."""
        out = ("*%d\r\n" % len(parts)).encode()
        for part in parts:
            raw = str(part).encode()
            out += b"$" + str(len(raw)).encode() + b"\r\n" + raw + b"\r\n"
        return out


    def check_db():
        """Devuelve (ok, detalle). Prueba: TCP -> AUTH -> PING."""
        started = time.time()
        target = "%s:%d" % (DB_HOST, DB_PORT)
        try:
            with socket.create_connection((DB_HOST, DB_PORT), timeout=DB_TIMEOUT) as sock:
                sock.settimeout(DB_TIMEOUT)
                reader = sock.makefile("rb")
                sock.sendall(resp_command("AUTH", DB_USER, DB_PASS))
                auth_reply = reader.readline().decode(errors="replace").strip()
                if not auth_reply.startswith("+OK"):
                    return False, {"stage": "auth", "target": target, "error": auth_reply}
                sock.sendall(resp_command("PING"))
                ping_reply = reader.readline().decode(errors="replace").strip()
                if ping_reply != "+PONG":
                    return False, {"stage": "ping", "target": target, "error": ping_reply}
        except ConnectionRefusedError:
            return False, {"stage": "connect", "target": target,
                           "error": "Connection refused (el Service no apunta al puerto donde escucha la BD)"}
        except socket.gaierror as exc:
            return False, {"stage": "dns", "target": target, "error": "DNS: " + str(exc)}
        except TimeoutError:
            return False, {"stage": "timeout", "target": target,
                           "error": "Timeout (bloqueo de red o Service sin endpoints)"}
        except OSError as exc:
            return False, {"stage": "network", "target": target, "error": str(exc)}
        return True, {"target": target, "authenticated_as": DB_USER,
                      "latency_ms": round((time.time() - started) * 1000, 1)}


    def root_fs_writable():
        """True si el proceso logra escribir en / (NO deberia, por readOnlyRootFilesystem)."""
        try:
            with open("/proof-rw", "w") as handle:
                handle.write("x")
            os.remove("/proof-rw")
            return True
        except OSError:
            return False


    class Handler(BaseHTTPRequestHandler):
        server_version = "s12-backend/1.0"

        def _send(self, code, payload):
            body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json; charset=utf-8")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            path = self.path.split("?")[0]
            if path == "/health":
                self._send(200, {"status": "UP"})
            elif path == "/ready":
                ok, detail = check_db()
                self._send(200 if ok else 503, {"status": "READY" if ok else "NOT_READY", "db": detail})
            elif path == "/whoami":
                self._send(200, {
                    "pod": socket.gethostname(),
                    "uid": os.getuid(),
                    "gid": os.getgid(),
                    "root_fs_writable": root_fs_writable(),
                })
            elif path == "/":
                ok, detail = check_db()
                self._send(200 if ok else 503, {
                    "service": "practica-s12-backend",
                    "environment": APP_ENV,
                    "pod": socket.gethostname(),
                    "uid": os.getuid(),
                    "database": {"connected": ok, **detail},
                })
            else:
                self._send(404, {"error": "Not Found", "path": path})

        def log_message(self, fmt, *args):
            log("%s - %s" % (self.address_string(), fmt % args))


    if __name__ == "__main__":
        log("Iniciando backend | uid=%d | puerto=%d | BD=%s:%d | usuario BD=%s"
            % (os.getuid(), APP_PORT, DB_HOST, DB_PORT, DB_USER))
        ThreadingHTTPServer(("0.0.0.0", APP_PORT), Handler).serve_forever()
---
# -----------------------------------------------------------------------------
# BASE DE DATOS: Redis 7 autenticado.
# Se eligio Redis porque su imagen oficial soporta un UID arbitrario (10001) con
# readOnlyRootFilesystem sin scripts de inicializacion, permitiendo aplicar el
# hardening COMPLETO tambien a la base de datos.
# La contrasena llega desde el Secret `db-credentials` por secretKeyRef y se
# expande en los args con la sintaxis $(VAR) de Kubernetes.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: practica-s12
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: practica-s12
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: practica-s12
    spec:
      automountServiceAccountToken: false
      securityContext:                      # ---- nivel POD ----
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          # Espejo de Docker Hub en ECR Public: evita el limite de pulls anonimos.
          image: public.ecr.aws/docker/library/redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --appendonly
            - "no"
            - --save
            - ""
          ports:
            - name: redis               # puerto con NOMBRE: el Service lo referencia por nombre
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASS
            - name: REDISCLI_AUTH       # lo usa redis-cli en la sonda de readiness
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASS
          securityContext:                  # ---- nivel CONTENEDOR ----
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:                    # el proceso acepta conexiones TCP
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:                   # responde PONG autenticado
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: redis-data
          emptyDir:
            sizeLimit: 64Mi
---
# -----------------------------------------------------------------------------
# BACKEND: usa Python (imagen oficial slim) ejecutando el script del ConfigMap.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
  namespace: practica-s12
  labels:
    app.kubernetes.io/name: app-backend
    app.kubernetes.io/part-of: practica-s12
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: app-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-backend
        app.kubernetes.io/part-of: practica-s12
    spec:
      automountServiceAccountToken: false
      securityContext:                      # ---- nivel POD ----
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: public.ecr.aws/docker/library/python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/server.py"]
          ports:
            - name: http                    # el Service apunta a este puerto por nombre
              containerPort: 8080
          # Configuracion publica (ConfigMap) + credenciales (Secret).
          # Cada clave se convierte en una variable de entorno del mismo nombre.
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-credentials
          env:
            - name: PYTHONDONTWRITEBYTECODE   # no escribir .pyc (FS de solo lectura)
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          securityContext:                  # ---- nivel CONTENEDOR ----
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # ---- SONDAS DE SALUD (Escenario C: rutas y puerto CORRECTOS) ----
          livenessProbe:                    # "esta vivo?" -> NO depende de la BD
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:                   # "puede recibir trafico?" -> valida la BD
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: app-code
          configMap:
            name: backend-code
            defaultMode: 292                # 0444 en octal: solo lectura para todos
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
