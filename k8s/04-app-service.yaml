
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: practica-s12
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: practica-s12
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379            # lo que usa el backend (DB_HOST:DB_PORT del ConfigMap)
      targetPort: redis     # puerto nombrado en el contenedor (containerPort 6379)
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: practica-s12
  labels:
    app.kubernetes.io/name: app-backend
    app.kubernetes.io/part-of: practica-s12
  annotations:
    # Crea un Network Load Balancer (NLB) en lugar del Classic ELB.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # Balanceo entre zonas de disponibilidad.
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: app-backend
  ports:
    - name: http
      protocol: TCP
      port: 80              # puerto público del balanceador
      targetPort: http      # puerto nombrado del contenedor (8080, no privilegiado)